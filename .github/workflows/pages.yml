# Publishes site/ to GitHub Pages. Enable once:
#   repo Settings -> Pages -> Source: "GitHub Actions"
# The site is static, so there is no build step and no secrets are needed.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the site references an absolute path
        # Pages serves a project repo under /<repo>/, so a leading-slash
        # reference resolves to the domain root and 404s.
        run: |
          if grep -nE '(src|href)="/[^/]' site/*.html; then
            echo "Absolute path found in site/ — use ./relative paths."
            exit 1
          fi
          echo "All paths relative."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
